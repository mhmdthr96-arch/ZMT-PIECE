<div class="page" id="page-discounts">
  <div class="page-header">
    <div class="page-header-content" style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <h1><i class="fas fa-percent"></i> <span data-i18n="discounts.title">التخفيضات</span></h1>
        <p><span data-i18n="discounts.sub">سجل التخفيضات الممنوحة</span></p>
      </div>
    </div>
  </div>

  <div class="page-body">
    <div class="stats-grid" style="margin-bottom:20px">
      <div class="stat-card">
        <div class="stat-icon" style="background:#fff3e0;color:#e65100"><i class="fas fa-percent"></i></div>
        <div class="stat-info">
          <div class="stat-value" id="discTotalCount">0</div>
          <div class="stat-label" data-i18n="discounts.totalDiscounts">إجمالي التخفيضات</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8f5e9;color:#2e7d32"><i class="fas fa-money-bill-wave"></i></div>
        <div class="stat-info">
          <div class="stat-value" id="discTotalAmount">DA0</div>
          <div class="stat-label" data-i18n="discounts.totalValue">القيمة الإجمالية للتخفيضات</div>
        </div>
      </div>
    </div>

    <div class="inv-filters" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;background:var(--silver-50);border:1px solid var(--silver-300);border-radius:var(--radius);padding:12px 16px">
      <div class="search-bar" style="flex:1;min-width:180px;margin-bottom:0">
        <i class="fas fa-search"></i>
        <input type="text" id="discSearch" placeholder="بحث برقم الفاتورة أو المنتج..." data-i18n-placeholder="discounts.searchPlaceholder">
      </div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--silver-600)">
        <i class="fas fa-calendar-alt"></i>
        <input type="date" id="discDateFrom" onchange="renderDiscounts()" style="border:1px solid var(--silver-300);border-radius:4px;padding:4px 8px;font-size:12px;background:white;color:var(--silver-800);outline:none">
        <span>—</span>
        <input type="date" id="discDateTo" onchange="renderDiscounts()" style="border:1px solid var(--silver-300);border-radius:4px;padding:4px 8px;font-size:12px;background:white;color:var(--silver-800);outline:none">
      </div>
      <select id="discTypeFilter" onchange="renderDiscounts()" style="border:1px solid var(--silver-300);border-radius:4px;padding:5px 8px;font-size:12px;background:white;color:var(--silver-800);outline:none">
        <option value="all" data-i18n="discounts.all">جميع التخفيضات</option>
        <option value="sale" data-i18n="discounts.bySale">تخفيض البيع</option>
        <option value="manual" data-i18n="discounts.manual">تخفيض يدوي</option>
        <option value="line" data-i18n="discounts.byLine">تخفيض البنود</option>
      </select>
      <button class="btn btn-sm" onclick="resetDiscFilters()" style="font-size:11px"><i class="fas fa-undo"></i></button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:12px;color:var(--silver-500)" id="discResultsInfo" data-i18n="discounts.zeroDiscount">0 تخفيض</span>
    </div>

    <div id="discList"></div>
  </div>
</div>
