<div class="page" id="page-dashboard">
  <div class="page-header">
    <div class="page-header-content">
      <h1><i class="fas fa-th-large"></i> <span data-i18n="dash.title">لوحة التحكم</span></h1>
      <p><span data-i18n="dash.sub">نظرة عامة على المبيعات والمخزون</span></p>
    </div>
  </div>

  <div class="page-body">
    <!-- Low Stock Alert -->
    <div id="lowStockAlert" style="display:none;margin-bottom:16px;background:#e65100;color:white;border-radius:var(--radius);overflow:hidden"></div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#0066B1"><i class="fas fa-box"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="statInventory">0</span>
          <span class="stat-label" data-i18n="dash.s1">قطعة في المخزون</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#004080"><i class="fas fa-file-invoice"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="statInvoices">0</span>
          <span class="stat-label" data-i18n="dash.s2">فاتورة هذا الشهر</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#003366"><i class="fas fa-users"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="statCustomers">0</span>
          <span class="stat-label" data-i18n="dash.s3">عميل مسجل</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#002244"><i class="fas fa-dollar-sign"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="statSales">DA0</span>
          <span class="stat-label" data-i18n="dash.s4">إجمالي المبيعات</span>
        </div>
      </div>
    </div>

    <!-- Extra stats -->
    <div class="stats-grid" style="margin-bottom:20px">
      <div class="stat-card" style="background:linear-gradient(135deg,#fff8e1,#fff3e0)">
        <div class="stat-icon" style="background:#e65100"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="dashLowStock" style="color:#e65100">0</span>
          <span class="stat-label" data-i18n="dash.lowStock">منتجات تحت حد المخزون</span>
        </div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,#e8f5e9,#f1f8e9)">
        <div class="stat-icon" style="background:#28a745"><i class="fas fa-coins"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="dashProfit" style="color:#28a745">DA0</span>
          <span class="stat-label" data-i18n="dash.estimatedProfit">إجمالي الربح المقدر</span>
        </div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,#e3f2fd,#e8eaf6)">
        <div class="stat-icon" style="background:#0066B1"><i class="fas fa-calendar-check"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="dashMonthSales" style="color:var(--bmw-blue-1)">DA0</span>
          <span class="stat-label" data-i18n="dash.monthSales">مبيعات هذا الشهر</span>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="two-col" style="margin-bottom:20px">
      <div class="chart-section">
        <div class="chart-header">
          <h3><i class="fas fa-chart-bar"></i> <span data-i18n="dash.chart">المبيعات مقابل المخزون والمرتجعات</span></h3>
          <div class="month-selector">
            <label data-i18n="dash.months">عدد الأشهر:</label>
            <select id="monthSelect">
              <option value="1">1 <span data-i18n="dash.m1">شهر</span></option>
              <option value="2" selected>2 <span data-i18n="dash.m2">شهرين</span></option>
              <option value="3">3 <span data-i18n="dash.m3">أشهر</span></option>
              <option value="4">4 <span data-i18n="dash.m4">أشهر</span></option>
              <option value="5">5 <span data-i18n="dash.m5">أشهر</span></option>
              <option value="6">6 <span data-i18n="dash.m6">أشهر</span></option>
            </select>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="salesChart"></canvas>
        </div>
      </div>

      <div class="chart-section">
        <div class="chart-header">
          <h3><i class="fas fa-chart-pie"></i> <span data-i18n="dash.profitCostDist">توزيع الربح والتكلفة</span></h3>
        </div>
        <div class="chart-container">
          <canvas id="profitChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
