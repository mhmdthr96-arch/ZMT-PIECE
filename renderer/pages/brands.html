<div class="page" id="page-brands">
  <div class="page-header">
    <div class="page-header-content">
      <h1><i class="fas fa-tags"></i> <span data-i18n="brands.title">العلامات التجارية</span></h1>
      <p><span data-i18n="brands.sub">إدارة الأصناف والعلامات التجارية</span></p>
    </div>
  </div>

  <div class="page-body">
    <!-- Context bar: shown when a kind is selected (breadcrumb + back + actions) -->
    <div class="brands-context-bar" id="brandsContextBar" style="display:none">
      <button class="btn" onclick="returnToKinds()"><i class="fas fa-arrow-right"></i> <span data-i18n="brands.backToKinds">الأصناف</span></button>
      <div class="brands-crumb">
        <span class="brands-crumb-kind" id="brandsCrumbKind"></span>
        <span class="brands-crumb-div">/</span>
        <strong data-i18n="brands.brandsOfKind">العلامات التجارية</strong>
      </div>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" data-i18n-placeholder="brands.search" placeholder="بحث عن علامة تجارية..." id="brandSearch">
      </div>
      <button class="btn btn-primary" onclick="openAddBrandModal()"><i class="fas fa-plus"></i> <span data-i18n="brands.addBrand">إضافة علامة</span></button>
    </div>

    <!-- Kinds grid (first view) -->
    <div id="kindsGrid" class="brand-grid kinds-grid"></div>

    <!-- Brands grid (after selecting a kind) -->
    <div class="brand-grid" id="allBrandsGrid" style="display:none"></div>
  </div>
</div>

<!-- ===== ADD KIND (إضافة أخرى) MODAL ===== -->
<div class="modal-overlay" id="addKindModal" style="display:none">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3><i class="fas fa-plus-circle"></i> <span data-i18n="brands.addKindTitle">إضافة صنف جديد</span></h3>
      <button class="modal-close" onclick="closeAddKindModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label data-i18n="brands.kindName">اسم الصنف</label>
        <input type="text" class="form-input" id="addKindName" placeholder="مثال: أدوات رياضية">
      </div>
      <div class="form-group">
        <label data-i18n="brands.kindIcon">أيقونة (اختياري)</label>
        <input type="text" class="form-input" id="addKindIcon" placeholder="fas fa-dumbbell" dir="ltr">
      </div>
      <div class="form-group">
        <label data-i18n="brands.kindColor">لون</label>
        <input type="color" class="form-input" id="addKindColor" value="#0066B1" style="height:42px;padding:4px">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAddKindModal()"><span data-i18n="common.cancel">إلغاء</span></button>
      <button class="btn btn-primary" onclick="saveNewKind()"><i class="fas fa-check"></i> <span data-i18n="common.save">حفظ</span></button>
    </div>
  </div>
</div>

<!-- ===== ADD BRAND MODAL ===== -->
<div class="modal-overlay" id="addBrandModal" style="display:none">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <h3><i class="fas fa-plus-circle"></i> <span id="addBrandModalTitle" data-i18n="brands.addBrandTitle">إضافة علامة تجارية</span></h3>
      <button class="modal-close" onclick="closeAddBrandModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label data-i18n="brands.brandName">اسم العلامة</label>
        <input type="text" class="form-input" id="addBrandName" placeholder="مثال: Adidas">
      </div>
      <div class="form-group">
        <label data-i18n="brands.brandCountry">البلد</label>
        <input type="text" class="form-input" id="addBrandCountry" placeholder="مثال: ألمانيا">
      </div>
      <div class="form-group">
        <label data-i18n="brands.brandColor">لون العلامة</label>
        <input type="color" class="form-input" id="addBrandColor" value="#0066B1" style="height:42px;padding:4px">
      </div>
      <div class="form-group">
        <label data-i18n="brands.brandKind">الصنف</label>
        <select class="form-input" id="addBrandKind" disabled></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAddBrandModal()"><span data-i18n="common.cancel">إلغاء</span></button>
      <button class="btn btn-primary" onclick="saveNewBrand()"><i class="fas fa-check"></i> <span id="addBrandBtnLabel" data-i18n="common.save">حفظ</span></button>
    </div>
  </div>
</div>
