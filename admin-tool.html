<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZMT PIECE — إدارة التراخيص</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2333;
    --border: #2d333b;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  header h1 { font-size: 20px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin-bottom: 14px; color: var(--text); display:flex; align-items:center; gap:8px; }
  .card h2 i { color: var(--accent); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 180px; }
  .field.sm { flex: 0 0 130px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input, select, button {
    font-family: inherit; font-size: 14px; border-radius: 8px;
  }
  input, select {
    width: 100%; padding: 9px 12px; background: var(--panel2);
    border: 1px solid var(--border); color: var(--text); outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[dir=ltr] { direction: ltr; text-align: left; }
  button {
    cursor: pointer; border: none; padding: 9px 16px; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
  .msg.ok { display:block; background: rgba(63,185,80,.12); border: 1px solid rgba(63,185,80,.4); color: var(--green); }
  .msg.err { display:block; background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.4); color: var(--red); }
  .msg.warn { display:block; background: rgba(210,153,34,.12); border: 1px solid rgba(210,153,34,.4); color: var(--orange); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
  td.mono, .mono { font-family: Consolas, monospace; direction: ltr; text-align: left; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.unused { background: rgba(188,140,255,.15); color: var(--purple); }
  .badge.active { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.revoked { background: rgba(248,81,73,.15); color: var(--red); }
  .devices { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .devices .dev { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .devices .dev .chip { background: var(--panel2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px; }
  .devices .dev.released { opacity: .5; }
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 24px; font-size: 13px; }
  .keybox { display: flex; gap: 10px; align-items: center; }
  .keybox .mono { flex: 1; background: var(--panel2); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; font-size: 16px; letter-spacing: 1px; }
  details { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/logo.png" alt="" onerror="this.style.display='none'">
    <div>
      <h1>ZMT <span>PIECE</span> — إدارة التراخيص</h1>
      <div class="sub">أداة إصدار وإدارة مفاتيح التفعيل حسب المتجر والجهاز (SMBIOS)</div>
    </div>
  </header>

  <div class="card">
    <h2><i>🔐</i> السر الإداري</h2>
    <div class="row">
      <div class="field">
        <label>السر الإداري (يُحفظ في هذا المتصفح فقط)</label>
        <input type="password" id="adminSecret" dir="ltr" autocomplete="off" placeholder="أدخل LICENSE_ADMIN_SECRET">
      </div>
      <div class="field sm" style="align-self:flex-end">
        <button class="btn-primary" id="saveSecretBtn" style="width:100%">حفظ السر</button>
      </div>
    </div>
    <div class="hint">لا يُرسل السر إلا إلى خادمك عبر الرأس <code>x-zmt-admin</code>.</div>
  </div>

  <div class="card">
    <h2><i>➕</i> إصدار مفتاح جديد</h2>
    <div class="row">
      <div class="field">
        <label>رمز المتجر (المتجر الرئيسي)</label>
        <input type="text" id="issueStore" dir="ltr" placeholder="مثال: 7952352123" autocomplete="off">
      </div>
      <div class="field sm">
        <label>النوع</label>
        <select id="issueType">
          <option value="monthly">شهر واحد</option>
          <option value="yearly">سنة واحدة</option>
          <option value="3years">3 سنوات</option>
          <option value="custom">مخصص</option>
        </select>
      </div>
      <div class="field sm" id="daysField" style="display:none">
        <label>عدد الأيام</label>
        <input type="number" id="issueDays" value="30" min="1" max="3650">
      </div>
      <div class="field sm">
        <label>حد الأجهزة</label>
        <input type="number" id="issueDevices" value="1" min="1" max="50">
      </div>
      <div class="field sm" style="align-self:flex-end">
        <button class="btn-primary" id="issueBtn" style="width:100%">إصدار</button>
      </div>
    </div>
    <div class="msg" id="issueMsg"></div>
    <div id="issueResult" style="display:none; margin-top:14px">
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">المفتاح الجديد — سلمه لصاحب المتجر</label>
      <div class="keybox">
        <div class="mono" id="issuedKey"></div>
        <button class="btn-ghost" id="copyKeyBtn">نسخ</button>
      </div>
      <div class="hint" id="issuedMeta"></div>
    </div>
  </div>

  <div class="card">
    <h2><i>📋</i> التراخيص</h2>
    <div class="row" style="margin-bottom:12px">
      <div class="field">
        <label>رمز المتجر (اتركه فارغاً لعرض الكل)</label>
        <input type="text" id="listStore" dir="ltr" placeholder="فارغ = كل المتاجر" autocomplete="off">
      </div>
      <div class="field sm" style="align-self:flex-end">
        <button class="btn-primary" id="listBtn" style="width:100%">عرض</button>
      </div>
    </div>
    <div class="msg" id="listMsg"></div>
    <div id="listWrap">
      <div class="empty">اضغط «عرض» لتحميل التراخيص</div>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>فك ربط أو إلغاء يدوي (نادر)</summary>
      <div class="row" style="margin-top:12px">
        <div class="field">
          <label>فك ربط جهاز — معرف الجهاز (64 حرف)</label>
          <input type="text" id="relHash" dir="ltr" placeholder="smbios hash..." autocomplete="off">
        </div>
        <div class="field sm" style="align-self:flex-end">
          <button class="btn-ghost" id="relBtn">فك الربط</button>
        </div>
        <div class="field">
          <label>إلغاء ترخيص — المفتاح</label>
          <input type="text" id="revKey" dir="ltr" placeholder="ZMT-XXXX-XXXX-XXXX" autocomplete="off">
        </div>
        <div class="field sm" style="align-self:flex-end">
          <button class="btn-danger" id="revBtn">إلغاء</button>
        </div>
      </div>
      <div class="msg" id="manualMsg"></div>
    </details>
  </div>
</div>

<script>
(function () {
  'use strict';

  var API = 'https://zmt-website.vercel.app/api/push-trigger';
  var SECRET_KEY = 'zmt_admin_secret';

  var $ = function (id) { return document.getElementById(id); };

  function getSecret() {
    var s = $('adminSecret').value.trim();
    if (!s) s = localStorage.getItem(SECRET_KEY) || '';
    return s;
  }

  function showMsg(el, text, type) {
    el.className = 'msg ' + type;
    el.textContent = text;
    el.style.display = 'block';
  }

  function hideMsg(el) {
    el.style.display = 'none';
    el.className = 'msg';
  }

  async function api(action, body, secret) {
    var resp = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-zmt-admin': secret
      },
      body: JSON.stringify(Object.assign({ action: action }, body || {}))
    });
    var data = null;
    try { data = await resp.json(); } catch (e) { data = null; }
    if (resp.status !== 200 || !data || !data.ok) {
      var err = new Error((data && data.error) || ('فشل الطلب (' + resp.status + ')'));
      err.status = resp.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  // ---- secret ----
  $('saveSecretBtn').addEventListener('click', function () {
    var s = $('adminSecret').value.trim();
    if (!s) return;
    localStorage.setItem(SECRET_KEY, s);
    $('adminSecret').value = '';
    showMsg($('issueMsg'), 'تم حفظ السر الإداري', 'ok');
    setTimeout(function () { hideMsg($('issueMsg')); }, 2000);
  });
  (function () {
    var saved = localStorage.getItem(SECRET_KEY);
    if (saved) $('adminSecret').placeholder = 'محفوظ ✓ — اتركه فارغاً للاستخدام';
  })();

  // ---- type / days ----
  $('issueType').addEventListener('change', function () {
    var t = this.value;
    $('daysField').style.display = t === 'custom' ? 'block' : 'none';
    if (t === 'custom') $('issueDays').value = 30;
  });

  // ---- issue ----
  $('issueBtn').addEventListener('click', async function () {
    var secret = getSecret();
    if (!secret) { showMsg($('issueMsg'), 'أدخل السر الإداري أولاً', 'err'); return; }
    var store = $('issueStore').value.trim();
    var type = $('issueType').value;
    var days = type === 'custom' ? parseInt($('issueDays').value, 10) || 30 : 0;
    var dev = parseInt($('issueDevices').value, 10) || 1;
    var btn = this;
    hideMsg($('issueMsg'));
    $('issueResult').style.display = 'none';
    btn.disabled = true; btn.textContent = 'جارٍ الإصدار...';
    try {
      var res = await api('license_issue', {
        storeCode: store, type: type, days: days, maxDevices: dev
      }, secret);
      $('issuedKey').textContent = res.license.key;
      var typeLabel = { monthly: 'شهر واحد', yearly: 'سنة واحدة', '3years': '3 سنوات', custom: res.license.days + ' يوم' }[res.license.type] || (res.license.days + ' يوم');
      $('issuedMeta').textContent = 'المتجر ' + res.license.storeCode + ' — ' + typeLabel + ' — ' + res.license.maxDevices + ' جهاز';
      $('issueResult').style.display = 'block';
      showMsg($('issueMsg'), 'تم إصدار المفتاح بنجاح', 'ok');
    } catch (e) {
      showMsg($('issueMsg'), e.message, 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'إصدار';
    }
  });

  $('copyKeyBtn').addEventListener('click', function () {
    var k = $('issuedKey').textContent;
    if (!k) return;
    navigator.clipboard.writeText(k).then(function () {
      var b = this;
      var old = b.textContent;
      b.textContent = 'تم النسخ ✓';
      setTimeout(function () { b.textContent = old; }, 1500);
    }.bind(this)).catch(function () {});
  });

  // ---- list ----
  function fmtDate(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderList(licenses) {
    if (!licenses.length) {
      return '<div class="empty">لا توجد تراخيص</div>';
    }
    var rows = licenses.map(function (l) {
      var typeLabel = { monthly: 'شهر', yearly: 'سنة', '3years': '3 سنوات', custom: l.days + ' يوم' }[l.type] || (l.days + ' يوم');
      var devs = (l.devices || []).map(function (d) {
        return '<div class="dev' + (d.status !== 'active' ? ' released' : '') + '">' +
          '<span class="chip">' + (d.device_type === 'branch' ? 'فرع' : 'رئيسي') + '</span>' +
          '<span class="mono">' + esc(d.device_smbios_hash.slice(0, 12)) + '…</span>' +
          '<span style="font-size:11px">' + (d.status === 'active' ? 'مفعّل' : 'مُفرَج') + ' · ' + fmtDate(d.activated_at) + '</span>' +
          (d.status === 'active'
            ? '<button class="btn-ghost btn-sm rel-dev" data-hash="' + esc(d.device_smbios_hash) + '">فك الربط</button>'
            : '') +
          '</div>';
      }).join('') || '<span style="font-size:11px">لا توجد أجهزة</span>';
      return '<tr>' +
        '<td class="mono">' + esc(l.key) + '</td>' +
        '<td class="mono">' + esc(l.store_code) + '</td>' +
        '<td>' + typeLabel + '</td>' +
        '<td>' + l.max_devices + '</td>' +
        '<td>' + fmtDate(l.issued_at) + '</td>' +
        '<td>' + fmtDate(l.expires_at) + '</td>' +
        '<td><span class="badge ' + esc(l.status) + '">' +
          ({ unused: 'غير مستخدم', active: 'مفعّل', revoked: 'ملغي' }[l.status] || l.status) + '</span></td>' +
        '<td><div class="devices">' + devs + '</div></td>' +
        '<td style="white-space:nowrap">' +
          (l.status === 'revoked'
            ? '<span style="color:var(--muted);font-size:11px">ملغي</span>'
            : '<button class="btn-danger btn-sm rev-lic" data-key="' + esc(l.key) + '">إلغاء</button>') +
        '</td></tr>';
    }).join('');

    return '<table><thead><tr>' +
      '<th>المفتاح</th><th>المتجر</th><th>النوع</th><th>أجهزة</th><th>أُصدر</th><th>الانتهاء</th><th>الحالة</th><th>الأجهزة</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  $('listBtn').addEventListener('click', async function () {
    var secret = getSecret();
    if (!secret) { showMsg($('listMsg'), 'أدخل السر الإداري أولاً', 'err'); return; }
    var store = $('listStore').value.trim();
    var btn = this;
    hideMsg($('listMsg'));
    $('listWrap').innerHTML = '<div class="empty">جارٍ التحميل...</div>';
    btn.disabled = true;
    try {
      var res = await api('license_list', { storeCode: store }, secret);
      $('listWrap').innerHTML = renderList(res.licenses || []);
      bindTableActions();
    } catch (e) {
      $('listWrap').innerHTML = '<div class="empty">—</div>';
      showMsg($('listMsg'), e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  });

  function bindTableActions() {
    Array.prototype.forEach.call(document.querySelectorAll('.rel-dev'), function (btn) {
      btn.addEventListener('click', async function () {
        var secret = getSecret();
        if (!secret) { showMsg($('listMsg'), 'أدخل السر الإداري أولاً', 'err'); return; }
        var hash = this.getAttribute('data-hash');
        this.disabled = true; this.textContent = '...';
        try {
          await api('license_release', { smbiosHash: hash }, secret);
          $('listBtn').click();
        } catch (e) {
          showMsg($('listMsg'), e.message, 'err');
          this.disabled = false; this.textContent = 'فك الربط';
        }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.rev-lic'), function (btn) {
      btn.addEventListener('click', async function () {
        var secret = getSecret();
        if (!secret) { showMsg($('listMsg'), 'أدخل السر الإداري أولاً', 'err'); return; }
        var key = this.getAttribute('data-key');
        if (!confirm('إلغاء الترخيص ' + key + '؟\nسيُمنع التفعيل بهذا المفتاح فوراً.')) return;
        this.disabled = true; this.textContent = '...';
        try {
          await api('license_revoke', { key: key }, secret);
          $('listBtn').click();
        } catch (e) {
          showMsg($('listMsg'), e.message, 'err');
          this.disabled = false; this.textContent = 'إلغاء';
        }
      });
    });
  }

  // ---- manual release / revoke ----
  $('relBtn').addEventListener('click', async function () {
    var secret = getSecret();
    if (!secret) { showMsg($('manualMsg'), 'أدخل السر الإداري أولاً', 'err'); return; }
    var hash = $('relHash').value.trim().toLowerCase();
    if (!hash) { showMsg($('manualMsg'), 'أدخل معرف الجهاز', 'err'); return; }
    hideMsg($('manualMsg'));
    try {
      var res = await api('license_release', { smbiosHash: hash }, secret);
      showMsg($('manualMsg'), 'تم فك ربط ' + res.released + ' جهاز', 'ok');
    } catch (e) { showMsg($('manualMsg'), e.message, 'err'); }
  });

  $('revBtn').addEventListener('click', async function () {
    var secret = getSecret();
    if (!secret) { showMsg($('manualMsg'), 'أدخل السر الإداري أولاً', 'err'); return; }
    var key = $('revKey').value.trim().toUpperCase();
    if (!key) { showMsg($('manualMsg'), 'أدخل المفتاح', 'err'); return; }
    if (!confirm('إلغاء الترخيص ' + key + '؟')) return;
    hideMsg($('manualMsg'));
    try {
      var res = await api('license_revoke', { key: key }, secret);
      showMsg($('manualMsg'), res.revoked ? 'تم إلغاء الترخيص' : 'المفتاح غير موجود', res.revoked ? 'ok' : 'warn');
    } catch (e) { showMsg($('manualMsg'), e.message, 'err'); }
  });
})();
</script>
</body>
</html>
